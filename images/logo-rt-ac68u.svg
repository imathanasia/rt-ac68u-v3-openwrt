<svg xmlns="http://www.w3.org/2000/svg" width="980" height="240" viewBox="0 0 980 240" role="img" aria-label="ASUS RT-AC68U V3 running OpenWrt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="0.55" stop-color="#101a2c"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="980" height="240" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="978" height="238" rx="18" fill="none" stroke="#22304a"/>
  <!-- router body -->
  <g transform="translate(52,54)">
    <rect x="0" y="46" width="150" height="70" rx="12" fill="#16233a" stroke="#2b4062"/>
    <rect x="12" y="58" width="126" height="10" rx="5" />
    <rect x="12" y="58" width="126" height="10" rx="5" fill="#1f3252"/>
    <circle cx="26" cy="92" r="4.5" fill="#7ee787"/>
    <circle cx="44" cy="92" r="4.5" fill="#58a6ff"/>
    <circle cx="62" cy="92" r="4.5" fill="#d29922"/>
    <!-- antennas -->
    <g stroke="#3d5680" stroke-width="7" stroke-linecap="round">
      <line x1="26" y1="46" x2="2" y2="2"/><line x1="75" y1="46" x2="75" y2="-6"/><line x1="124" y1="46" x2="148" y2="2"/>
    </g>
    <circle cx="75" cy="46" r="6" fill="#58a6ff" filter="url(#glow)"/>
  </g>
  <!-- tux -->
  <g transform="translate(232,62) scale(1.15)">
    <ellipse cx="34" cy="52" rx="30" ry="34" fill="#101826" stroke="#2b4062"/>
    <ellipse cx="34" cy="38" rx="18" ry="20" fill="#0b1220"/>
    <circle cx="27" cy="34" r="3.2" fill="#e6edf3"/><circle cx="41" cy="34" r="3.2" fill="#e6edf3"/>
    <ellipse cx="34" cy="42" rx="5" ry="3.4" fill="#d29922"/>
    <path d="M10 84c6-10 14-14 24-14s18 4 24 14" fill="none" stroke="#58a6ff" stroke-width="3"/>
  </g>
  <!-- text -->
  <text x="330" y="86" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="40" font-weight="700" fill="#e6edf3">ASUS RT-AC68U V3</text>
  <text x="330" y="124" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="21" fill="#9fc4ff">OpenWrt 25.12 · b43 AC-PHY · 2× BCM4360 · homelab build</text>
  <text x="330" y="160" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="15" fill="#8b98a9">AdGuard · Tailscale · WireGuard · SQM · SMB3 · aria2 · stats · radios off by default</text>
  <g transform="translate(330,176)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#12233a" stroke="#2d4a72"/>
    <text x="12" y="16" font-family="system-ui,sans-serif" font-size="12" fill="#7ee787">mod by ImAthanasia</text>
    <rect x="130" y="0" width="86" height="24" rx="12" fill="#12233a" stroke="#2d4a72"/>
    <text x="142" y="16" font-family="system-ui,sans-serif" font-size="12" fill="#58a6ff">bcm53xx</text>
    <rect x="226" y="0" width="96" height="24" rx="12" fill="#12233a" stroke="#2d4a72"/>
    <text x="238" y="16" font-family="system-ui,sans-serif" font-size="12" fill="#d29922">kernel 6.18</text>
  </g>
  <path d="M900 40l-26 60h30l-18 52 56-74h-32l24-38z" fill="url(#acc)" opacity="0.9" filter="url(#glow)"/>
</svg>
