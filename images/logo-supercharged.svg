<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="ASUS RT-AC3200 - OpenWrt build - supercharged">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1018"/><stop offset="1" stop-color="#0f1c2d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32476a"/><stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2839"/><stop offset="1" stop-color="#111a26"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#d29922"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="250" rx="22" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="249" rx="22" fill="none" stroke="#263041"/>

  <!-- lightning behind everything = supercharged -->
  <g filter="url(#glow)" opacity="0.55">
    <path d="M112 30 L84 118 L112 118 L92 196 L146 104 L116 104 Z" fill="url(#bolt)"/>
  </g>

  <!-- ============ router with hat ============ -->
  <g transform="translate(56,44)">
    <g fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#glow)">
      <path d="M104 6 a 30 30 0 0 1 34 0"/>
      <path d="M110 18 a 18 18 0 0 1 22 0"/>
      <path d="M116 30 a 8 8 0 0 1 10 0"/>
    </g>
    <rect x="26" y="50" width="5" height="34" rx="2.5" fill="#3d6ea8"/>
    <rect x="126" y="50" width="5" height="34" rx="2.5" fill="#3d6ea8"/>
    <circle cx="28.5" cy="48" r="4" fill="#58a6ff"/><circle cx="128.5" cy="48" r="4" fill="#58a6ff"/>

    <rect x="4" y="82" width="150" height="54" rx="12" fill="url(#body)" stroke="#3d6ea8" stroke-width="2"/>
    <g filter="url(#glow)">
      <circle cx="26" cy="101" r="4" fill="#58a6ff"/><circle cx="42" cy="101" r="4" fill="#3fb950"/>
      <circle cx="58" cy="101" r="4" fill="#d29922"/><circle cx="74" cy="101" r="4" fill="#6e7681"/>
      <circle cx="90" cy="101" r="4" fill="#6e7681"/>
    </g>
    <g stroke="#263041" stroke-width="2"><path d="M26 120h106"/><path d="M26 126h106"/></g>

    <!-- wizard hat -->
    <g transform="translate(54,-2) rotate(-7)">
      <path d="M6 70 C 12 46, 22 26, 34 8 C 40 28, 46 48, 60 70 Z" fill="url(#hat)" stroke="#3d6ea8" stroke-width="2"/>
      <path d="M0 70 C 20 61, 48 61, 66 70 C 48 80, 20 80, 0 70 Z" fill="#24334a" stroke="#3d6ea8" stroke-width="2"/>
      <circle cx="34" cy="20" r="3" fill="#ffd166" filter="url(#glow)"/>
      <path d="M26 42 l2.6 5 5.4 1 -4 4 1 5.6 -4.9 -2.7 -4.9 2.7 1 -5.6 -4 -4 5.4 -1 z" fill="#ffd166" opacity="0.95" filter="url(#glow)"/>
    </g>

    <!-- penguin (Tux-like, drawn from scratch) -->
    <g transform="translate(196,54)">
      <ellipse cx="10" cy="93" rx="13" ry="6" fill="#ffb454"/>
      <ellipse cx="34" cy="93" rx="13" ry="6" fill="#ffb454"/>
      <path d="M22 2 C 6 2, -2 22, -2 44 C -2 72, 8 90, 22 90 C 36 90, 46 72, 46 44 C 46 22, 38 2, 22 2 Z" fill="#0b1016" stroke="#2a3a52" stroke-width="1.5"/>
      <path d="M22 30 C 14 30, 9 42, 9 55 C 8 72, 14 84, 22 84 C 30 84, 36 72, 36 55 C 36 41, 31 27, 22 27 Z" fill="#eef3f8"/>
      <ellipse cx="22" cy="20.5" rx="15" ry="12.5" fill="#eef3f8"/>
      <circle cx="16" cy="18.5" r="3.8" fill="#ffffff"/><circle cx="28" cy="18.5" r="3.8" fill="#ffffff"/>
      <circle cx="16.3" cy="18.6" r="2.2" fill="#0b1016"/><circle cx="27.7" cy="18.6" r="2.2" fill="#0b1016"/>
      <path d="M17 24 L27 24 L22 30 Z" fill="#ffb454"/>
      <path d="M18 27.5 L26 27.5 L22 32 Z" fill="#e8912f"/>
      <path d="M-2 42 C -12 52, -12 70, -6 78 C -2 70, -1 56, 2 48 Z" fill="#0b1016"/>
      <path d="M46 42 C 56 52, 56 70, 50 78 C 46 70, 45 56, 42 48 Z" fill="#0b1016"/>
    </g>
  </g>

  <!-- ============ text block ============ -->
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <text x="392" y="70" fill="#e6edf3" font-size="33" font-weight="700" letter-spacing="-0.4">ASUS RT-AC3200</text>
    <text x="392" y="97" fill="#8b98a9" font-size="15">OpenWrt 25.12 · Linux 6.12 · 3× BCM43602 · recovery-flashable</text>

    <!-- CPU chip -->
    <g transform="translate(392,110)">
      <rect x="0" y="0" width="252" height="30" rx="8" fill="#101a26" stroke="#2c3f5e"/>
      <g stroke="#3d6ea8" stroke-width="2">
        <path d="M8 2v-2M18 2v-2M28 2v-2M38 2v-2M48 2v-2M58 2v-2M68 2v-2M78 2v-2M88 2v-2M98 2v-2M108 2v-2M118 2v-2M128 2v-2M138 2v-2M148 2v-2M158 2v-2M168 2v-2M178 2v-2M188 2v-2M198 2v-2M208 2v-2M218 2v-2M228 2v-2M238 2v-2M248 2v-2"/>
        <path d="M8 28v2M18 28v2M28 28v2M38 28v2M48 28v2M58 28v2M68 28v2M78 28v2M88 28v2M98 28v2M108 28v2M118 28v2M128 28v2M138 28v2M148 28v2M158 28v2M168 28v2M178 28v2M188 28v2M198 28v2M208 28v2M218 28v2M228 28v2M238 28v2M248 28v2"/>
      </g>
      <text x="11" y="20" fill="#8b98a9" font-size="11" letter-spacing="0.3">BCM4709A0 · ARM CORTEX-A9 · 2×1 GHz</text>
    </g>

    <!-- badges -->
    <g transform="translate(392,152)">
      <rect width="176" height="30" rx="15" fill="none" stroke="url(#edge)" stroke-width="1.6"/>
      <text x="14" y="20" fill="#58a6ff" font-size="12" letter-spacing="0.8">PRE-CONFIGURED</text>
    </g>
    <g transform="translate(580,152)">
      <rect width="150" height="30" rx="15" fill="#1c1607" stroke="#7a5a12" stroke-width="1.6"/>
      <path d="M15 4 l-6 12 h6 l-4 10 10 -13 h-6 z" fill="#ffd166"/>
      <text x="34" y="20" fill="#ffd166" font-size="11" letter-spacing="1">SUPERCHARGED</text>
    </g>
    <text x="392" y="212" fill="#5c6878" font-size="11">AdGuard Home · Tailscale · WireGuard · SQM · Samba · aria2</text>
  </g>
</svg>
