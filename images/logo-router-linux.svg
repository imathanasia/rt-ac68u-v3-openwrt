<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-label="RT-AC3200 running Linux">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1622"/><stop offset="1" stop-color="#101d2c"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="760" height="180" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="759" height="179" rx="18" fill="none" stroke="#263041"/>

  <!-- router -->
  <g transform="translate(60,52)">
    <rect x="0" y="46" width="150" height="44" rx="10" fill="#16202c" stroke="#3d6ea8" stroke-width="2"/>
    <rect x="14" y="64" width="18" height="8" rx="4" fill="#58a6ff"/>
    <rect x="40" y="64" width="18" height="8" rx="4" fill="#3fb950"/>
    <rect x="66" y="64" width="18" height="8" rx="4" fill="#d29922"/>
    <rect x="92" y="64" width="18" height="8" rx="4" fill="#6e7681"/>
    <rect x="118" y="64" width="18" height="8" rx="4" fill="#6e7681"/>
    <path d="M20 46 L6 6" stroke="#3d6ea8" stroke-width="3" stroke-linecap="round"/>
    <path d="M130 46 L144 6" stroke="#3d6ea8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="6" cy="6" r="3.5" fill="#58a6ff"/><circle cx="144" cy="6" r="3.5" fill="#58a6ff"/>
    <!-- wifi waves -->
    <g fill="none" stroke="#3fb950" stroke-width="2.6" stroke-linecap="round" opacity="0.9">
      <path d="M172 34 a22 22 0 0 1 26 0"/>
      <path d="M177 44 a14 14 0 0 1 16 0"/>
      <path d="M182 54 a6 6 0 0 1 6 0"/>
    </g>
    <!-- penguin -->
    <g transform="translate(196,34)">
      <ellipse cx="26" cy="34" rx="20" ry="24" fill="#0b1016" stroke="#263041" stroke-width="2"/>
      <ellipse cx="26" cy="40" rx="13" ry="16" fill="#e6edf3"/>
      <circle cx="20" cy="22" r="2.6" fill="#e6edf3"/><circle cx="32" cy="22" r="2.6" fill="#e6edf3"/>
      <circle cx="20" cy="22" r="1.1" fill="#0b1016"/><circle cx="32" cy="22" r="1.1" fill="#0b1016"/>
      <path d="M23 28 L29 28 L26 33 Z" fill="#d29922"/>
      <path d="M15 58 q-8 6 -6 12 q4 -4 8 -4" fill="#d29922"/>
      <path d="M37 58 q8 6 6 12 q-4 -4 -8 -4" fill="#d29922"/>
