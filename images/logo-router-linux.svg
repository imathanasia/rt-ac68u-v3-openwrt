  <!-- text -->
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="330" y="76" fill="#e6edf3" font-size="30" font-weight="700">ASUS RT-AC3200</text>
    <text x="330" y="104" fill="#8b98a9" font-size="15">OpenWrt 25.12 · Linux 6.12 · 3× BCM43602</text>
    <rect x="330" y="118" width="212" height="24" rx="12" fill="none" stroke="url(#acc)" stroke-width="1.5"/>
    <text x="342" y="135" fill="#58a6ff" font-size="12.5" letter-spacing="0.6">PRE-CONFIGURED · RECOVERY-FLASHABLE</text>
  </g>
