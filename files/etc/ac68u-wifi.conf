# AC68U V3 wireless settings
#
# Edit this file and run:  /etc/init.d/ac68u-wifi restart
# (or simply change it and reboot).

# Network name.  The 2.4 GHz radio gets "<SSID>-2G", the 5 GHz radio "<SSID>-5G".
SSID="AC68U-V3"

# Wi-Fi key for both bands.  PLACEHOLDER - CHANGE IT.
KEY="change-me-now"

# Regulatory domain.  PL for Poland; this also caps the transmit power,
# using the antenna gain the board reports in NVRAM.
COUNTRY="PL"

# 2.4 GHz: HT20 only.  The AC-PHY 40 MHz path on 2.4 GHz is not
# characterised upstream yet, so it stays at 20 MHz.
CH_2G="1"

# 5 GHz: VHT80 on channel 36.
CH_5G="36"
HTMODE_5G="VHT80"

# Radios are OFF unless "wifi-radio on" is used (see /etc/uci-defaults/95-wifi-off.sh).
